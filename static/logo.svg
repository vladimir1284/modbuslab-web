<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="logo-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Mark Icon -->
  <g id="logo-mark">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#logo-bg)" stroke="#4338ca" stroke-width="1.5" />
    <line x1="10" y1="48" x2="54" y2="48" stroke="#3730a3" stroke-width="1.5" stroke-dasharray="2 2" />
    <path d="M 12 44 V 20 L 22 20 V 36 L 32 16 L 42 36 V 20 L 52 20 V 44"
          stroke="url(#logo-wave)"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#logo-glow)" />
    <circle cx="12" cy="44" r="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1" />
    <circle cx="12" cy="44" r="1.2" fill="#ffffff" />
    <circle cx="52" cy="44" r="3" fill="#34d399" stroke="#059669" stroke-width="1" />
    <circle cx="52" cy="44" r="1.2" fill="#ffffff" />
    <circle cx="32" cy="16" r="2.5" fill="#fbbf24" />
  </g>

  <!-- Typography -->
  <text x="76" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#312e81" letter-spacing="-0.5">Modbus<tspan fill="#0284c7">Lab</tspan></text>
  <rect x="220" y="20" width="46" height="20" rx="4" fill="#312e81" />
  <text x="243" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">WEB</text>
</svg>
